<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1b63c2">
  <title>Change Password – Mahendra Hostel</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body {
      background: #f8f7fc;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
    }

    .app-page {
      background: #f8f7fc;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Header matching Screenshot 1 */
    .app-header {
      background: linear-gradient(90deg, #1b63c2 0%, #3e1e82 100%) !important;
      padding: calc(var(--safe-top) + 12px) 16px 14px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: flex-start !important;
      gap: 16px !important;
      border-bottom: none !important;
      box-shadow: 0 2px 10px rgba(30, 20, 100, 0.2) !important;
    }

    .header-back-btn {
      background: none !important;
      border: none !important;
      cursor: pointer !important;
      padding: 6px !important;
      margin: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      color: #ffffff !important;
      border-radius: 8px !important;
      flex-shrink: 0 !important;
      text-decoration: none !important;
      transition: background 0.15s ease;
    }

    .header-back-btn:hover, .header-back-btn:active {
      background: rgba(255, 255, 255, 0.18) !important;
    }

    .header-back-btn svg {
      width: 24px;
      height: 24px;
      stroke: #ffffff;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .header-title-text {
      font-family: 'Fredoka', 'Nunito', sans-serif !important;
      font-size: 1.35rem !important;
      font-weight: 600 !important;
      color: #ffffff !important;
      letter-spacing: 0.3px !important;
      margin: 0 !important;
      text-align: left !important;
    }

    .page-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px 40px;
      box-sizing: border-box;
    }

    /* Centered White Card matching Screenshot 1 */
    .cp-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 36px 24px 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      box-sizing: border-box;
      animation: fadeIn 0.35s ease-out;
      text-align: center;
    }

    .cp-logo {
      width: 78px;
      height: auto;
      object-fit: contain;
      display: block;
      margin: 0 auto 16px;
    }

    .cp-card-title {
      font-family: 'Nunito', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: #2b1d6f;
      margin: 0 0 24px;
      letter-spacing: 0.2px;
    }

    /* Pill Input Fields matching Screenshot 1 */
    .cp-input-pill {
      border: 1.5px solid #c7d2fe;
      border-radius: 28px;
      padding: 13px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      background: #ffffff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .cp-input-pill:focus-within {
      border-color: #2b1d6f;
      box-shadow: 0 0 0 3px rgba(43, 29, 111, 0.08);
    }

    .cp-icon {
      width: 20px;
      height: 20px;
      color: #3b2075;
      flex-shrink: 0;
    }

    .cp-input-field {
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: #1e293b;
    }

    .cp-input-field::placeholder {
      color: #94a3b8;
      font-weight: 500;
    }

    /* Submit Button matching Screenshot 1 */
    .cp-submit-btn {
      background: #231c6b;
      color: #ffffff;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 13px 40px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(35, 28, 107, 0.3);
      transition: transform 0.15s ease, background 0.15s ease;
      display: inline-block;
    }

    .cp-submit-btn:hover {
      background: #31278f;
      transform: translateY(-1px);
    }

    .cp-submit-btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <!-- Page Loader (Matching Screenshot 3) -->
  <div id="page-loader" class="page-loader hidden">
    <div class="spinner"></div>
  </div>

  <div id="toast-container"></div>

  <div class="app-page">
    <!-- Header matching Screenshot 1 -->
    <header class="app-header">
      <a href="dashboard.html" class="header-back-btn" aria-label="Back to Dashboard">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <h1 class="header-title-text">Change Password</h1>
    </header>

    <!-- Main Content matching Screenshot 1 -->
    <main class="page-content">
      <div class="cp-card">
        <!-- Authentic MEI Logo -->
        <img src="assets/icons/mei-logo.png" alt="MEI Logo" class="cp-logo">

        <!-- Title -->
        <div class="cp-card-title">Change Password</div>

        <form id="cp-form" onsubmit="handleChangePassword(event)">
          <!-- Old Password -->
          <div class="cp-input-pill">
            <svg class="cp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="old-pass" class="cp-input-field" placeholder="Old Password" required>
          </div>

          <!-- New Password -->
          <div class="cp-input-pill">
            <svg class="cp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="new-pass" class="cp-input-field" placeholder="New Password" required minlength="4">
          </div>

          <!-- Confirm Password -->
          <div class="cp-input-pill">
            <svg class="cp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="confirm-pass" class="cp-input-field" placeholder="Confirm Password" required minlength="4">
          </div>

          <!-- Submit Button -->
          <button type="submit" class="cp-submit-btn">SUBMIT</button>
        </form>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initFirebase();
    const session = typeof checkSession === 'function' ? checkSession() : { valid: false };
    const currentUser = session.valid ? session.user : null;

    if (!currentUser) {
      window.location.replace('login.html');
    }

    function handleChangePassword(e) {
      e.preventDefault();
      const oldPass = document.getElementById('old-pass').value;
      const newPass = document.getElementById('new-pass').value;
      const confirmPass = document.getElementById('confirm-pass').value;

      if (newPass !== confirmPass) {
        Toast.show('New Password and Confirm Password do not match!', 'error');
        return;
      }

      // Verify old password against current user
      const users = typeof getLocalUsersDB === 'function' ? getLocalUsersDB() : {};
      const dbUser = currentUser ? users[currentUser.uid] : null;

      if (dbUser && dbUser.passwordHash) {
        if (simpleHash(oldPass) !== dbUser.passwordHash) {
          Toast.show('Incorrect old password! Please try again.', 'error');
          return;
        }
      }

      // Update password
      if (currentUser && typeof updateUser === 'function') {
        updateUser(currentUser.uid, { password: newPass }, currentUser.uid);
      }

      Toast.show('Password changed successfully!', 'success');
      document.getElementById('cp-form').reset();

      setTimeout(() => {
        window.location.href = typeof getRoleRedirectURL === 'function' ? getRoleRedirectURL(currentUser.role) : 'dashboard.html';
      }, 1000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      PageLoader.hide();
    });
  </script>
</body>
</html>
