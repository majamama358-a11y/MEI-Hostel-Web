<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1b63c2">
  <title>Request – Mahendra Hostel</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body {
      background: #f4effa;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .app-page {
      background: #f4effa;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header matching Screenshot 1 */
    .app-header {
      background: linear-gradient(90deg, #1860c4 0%, #3e1b8a 100%) !important;
      padding: calc(var(--safe-top, 0px) + 12px) 16px 12px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      border-bottom: none !important;
      box-shadow: 0 2px 10px rgba(30, 20, 100, 0.2) !important;
      position: sticky;
      top: 0;
      z-index: 100;
      min-height: 56px;
      box-sizing: border-box;
      gap: 12px;
    }

    .header-left-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .header-back-btn {
      background: none !important;
      border: none !important;
      cursor: pointer !important;
      padding: 6px !important;
      margin: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      color: #ffffff !important;
      border-radius: 8px !important;
      flex-shrink: 0 !important;
      text-decoration: none !important;
      transition: background 0.15s ease;
    }

    .header-back-btn:hover, .header-back-btn:active {
      background: rgba(255, 255, 255, 0.16) !important;
    }

    .header-back-btn svg {
      width: 24px;
      height: 24px;
      stroke: #ffffff;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .header-title-text {
      font-family: 'Fredoka', 'Nunito', sans-serif !important;
      font-size: 1.35rem !important;
      font-weight: 700 !important;
      color: #ffffff !important;
      letter-spacing: 0.2px !important;
      margin: 0 !important;
      text-align: left !important;
      line-height: 1.2 !important;
    }

    /* Active Search Box */
    .header-search-bar {
      display: none;
      flex: 1;
      align-items: center;
      margin: 0 4px;
      animation: fadeIn 0.15s ease-out;
    }

    .header-search-cyan-icon {
      width: 20px;
      height: 20px;
      stroke: #38bdf8;
      stroke-width: 2.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      margin-right: 8px;
    }

    .header-search-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: 'Nunito', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      caret-color: #38bdf8;
      padding: 4px 0;
    }

    .header-search-input::placeholder {
      color: rgba(255, 255, 255, 0.65);
      font-weight: 400;
    }

    /* Search Action Button */
    .header-action-btn {
      background: none !important;
      border: none !important;
      cursor: pointer !important;
      padding: 6px !important;
      margin: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      color: #ffffff !important;
      border-radius: 8px !important;
      flex-shrink: 0 !important;
      transition: background 0.15s ease;
    }

    .header-action-btn:hover, .header-action-btn:active {
      background: rgba(255, 255, 255, 0.16) !important;
    }

    .header-action-btn svg {
      width: 22px;
      height: 22px;
      stroke: #ffffff;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .header-action-btn .icon-search {
      display: block;
      stroke-width: 2.2;
    }

    .header-action-btn .icon-close {
      display: none;
      stroke-width: 2.4;
    }

    /* When search mode is active */
    .app-header.search-mode .header-title-text {
      display: none !important;
    }

    .app-header.search-mode .header-search-bar {
      display: flex !important;
    }

    .app-header.search-mode .header-action-btn .icon-search {
      display: none !important;
    }

    .app-header.search-mode .header-action-btn .icon-close {
      display: block !important;
    }

    /* Page Content */
    .page-content {
      padding: 14px 12px 100px !important;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      flex: 1;
    }

    #requests-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    /* Request Card */
    .req-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px 16px 14px 18px;
      margin: 0;
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.04);
      box-sizing: border-box;
      width: 100%;
      animation: fadeIn 0.25s ease-out;
    }

    /* Mint Green curved organic shape matching Screenshot 1 */
    .req-card.is-approved::after {
      content: '';
      position: absolute;
      top: -20px;
      bottom: -20px;
      right: 0;
      width: 44%;
      background: #cbf6e2;
      border-radius: 100% 0 0 100% / 50% 0 0 50%;
      z-index: 0;
      pointer-events: none;
    }

    /* Soft Light Yellow curved shape when pending */
    .req-card.is-pending::after {
      content: '';
      position: absolute;
      top: -20px;
      bottom: -20px;
      right: 0;
      width: 44%;
      background: #fef08a;
      border-radius: 100% 0 0 100% / 50% 0 0 50%;
      z-index: 0;
      pointer-events: none;
    }

    .req-card-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .req-info-row {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.93rem;
      color: #111827;
      font-weight: 600;
      line-height: 1.2;
    }

    .req-field-label {
      width: 54px;
      color: #111827;
      font-weight: 700;
      flex-shrink: 0;
      font-size: 0.93rem;
    }

    .req-date-time-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .req-icon-small {
      width: 17px;
      height: 17px;
      color: #8892a0;
      flex-shrink: 0;
      display: inline-flex;
    }

    .req-icon-small.req-icon-user {
      width: 16px;
      height: 16px;
    }

    .req-divider {
      color: #cbd5e1;
      margin: 0 4px;
      font-weight: 400;
    }

    .req-timestamp-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.86rem;
      color: #111827;
      font-weight: 600;
      line-height: 1.2;
    }

    .req-detail-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.93rem;
      color: #111827;
      font-weight: 600;
      line-height: 1.2;
    }

    .req-status-text {
      color: #111827;
      font-weight: 600;
    }

    /* Red Trash Can Delete Button for pending requests */
    .req-delete-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #ef4444;
      border: none;
      border-radius: 6px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 3;
      transition: transform 0.15s ease, background 0.15s ease;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.35);
    }

    .req-delete-btn:hover {
      background: #dc2626;
      transform: scale(1.08);
    }

    .req-delete-btn svg {
      width: 16px;
      height: 16px;
      stroke: #ffffff;
      stroke-width: 2.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Stepper for 3-stage requests matching Screenshot 1 */
    .req-stepper-wrap {
      margin-top: 4px;
      padding: 4px 0 2px;
      position: relative;
      width: 100%;
    }

    .req-stepper-track {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      width: 82%;
      max-width: 320px;
    }

    .stepper-line {
      position: absolute;
      top: 50%;
      height: 2px;
      transform: translateY(-50%);
      z-index: 1;
    }

    .stepper-line-1 {
      left: 10px;
      width: calc(50% - 10px);
    }

    .stepper-line-2 {
      left: 50%;
      width: calc(50% - 10px);
    }

    .stepper-line.line-green {
      background: #0f766e;
    }

    .stepper-line.line-gray {
      background: #e2e8f0;
    }

    /* Checkmark Circle (Approved step) matching Screenshot 1 */
    .step-dot-approved {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #064e3b;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      color: #ffffff;
      box-shadow: 0 0 0 2px #ffffff;
      flex-shrink: 0;
    }

    .step-dot-approved svg {
      width: 12px;
      height: 12px;
      stroke: #ffffff;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Yellow Dot (Pending step) */
    .step-dot-pending {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #eab308;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      box-shadow: 0 0 0 2px #ffffff;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Action Bar helper when pending */
    .req-action-bar {
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      position: relative;
      z-index: 2;
    }

    .btn-advance-step {
      background: rgba(43, 29, 111, 0.08);
      color: #2b1d6f;
      border: 1px dashed #2b1d6f;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: all 0.15s ease;
    }

    .btn-advance-step:hover {
      background: #2b1d6f;
      color: #ffffff;
      border-style: solid;
    }

    /* Floating Action Button matching Screenshot 1 */
    .fab-new-btn {
      position: fixed;
      right: 20px;
      bottom: 24px;
      bottom: calc(max(24px, env(safe-area-inset-bottom, 24px)));
      right: calc(max(20px, env(safe-area-inset-right, 20px)));
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #2b146f;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(43, 20, 111, 0.4);
      z-index: 90;
      transition: transform 0.15s ease, background 0.15s ease;
      padding: 0;
    }

    .fab-new-btn:hover {
      background: #391e96;
      transform: scale(1.05);
    }

    .fab-new-btn:active {
      transform: scale(0.95);
    }

    .fab-new-btn svg {
      width: 26px;
      height: 26px;
      stroke: #ffffff;
      stroke-width: 2.8;
      stroke-linecap: round;
      fill: none;
    }

    /* Request Modal Bottom Sheet matching Screenshot 1 & 3 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 12, 45, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 999;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 560px;
      padding: 24px 22px 36px;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.25);
      position: relative;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-sizing: border-box;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-overlay.show .modal-card {
      transform: translateY(0);
    }

    .modal-close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      cursor: pointer;
      color: #ef4444;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    .modal-close-btn svg {
      width: 24px;
      height: 24px;
      stroke: #ef4444;
      stroke-width: 2.8;
      stroke-linecap: round;
    }

    .modal-title {
      text-align: center;
      font-family: 'Nunito', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: #111827;
      margin: 6px 0 24px;
    }

    /* Pill dropdown matching Screenshot 1 */
    .form-group-pill {
      border: 1.5px solid #c7d2fe;
      border-radius: 28px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      background: #ffffff;
      cursor: pointer;
    }

    .pill-select {
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #111827;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }

    .form-dt-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .form-dt-col {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1.5px solid #94a3b8;
      padding-bottom: 6px;
    }

    .form-dt-icon {
      width: 20px;
      height: 20px;
      color: #64748b;
      flex-shrink: 0;
    }

    .form-dt-divider {
      color: #94a3b8;
      font-weight: 400;
    }

    .form-dt-input {
      border: none;
      outline: none;
      background: transparent;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: #1e293b;
      width: 100%;
    }

    .cal-badge-wrap {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .cal-badge-icon {
      width: 32px;
      height: 32px;
    }

    .form-reason-box {
      width: 100%;
      box-sizing: border-box;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 18px;
      font-family: 'Fredoka', 'Nunito', sans-serif;
      font-size: 0.95rem;
      color: #111827;
      outline: none;
      margin-bottom: 24px;
      transition: border-color 0.2s ease;
    }

    .form-reason-box:focus {
      border-color: #2b1d6f;
    }

    .form-reason-box::placeholder {
      font-family: 'Fredoka', 'Nunito', sans-serif;
      color: #94a3b8;
    }

    .btn-submit-wrap {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    .btn-submit-modal {
      background: #2b1d6f;
      color: #ffffff;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 14px 44px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(43, 29, 111, 0.3);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn-submit-modal:hover {
      background: #392496;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <!-- Page Loader (Matching Screenshot 3) -->
  <div id="page-loader" class="page-loader hidden">
    <div class="spinner"></div>
  </div>

  <div id="toast-container"></div>
  <div id="confirm-dialog" class="confirm-dialog"></div>

  <div class="app-page">
    <!-- Header matching Screenshot 1 -->
    <header class="app-header" id="app-header">
      <div class="header-left-wrap">
        <a href="dashboard.html" class="header-back-btn" id="header-back-btn" aria-label="Back to Dashboard">
          <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </a>
        <h1 class="header-title-text" id="header-title">Request</h1>
      </div>

      <!-- Active search bar (shown only in search mode) -->
      <div class="header-search-bar" id="header-search-bar">
        <svg class="header-search-cyan-icon" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7.5"/>
          <line x1="21" y1="21" x2="16.5" y2="16.5"/>
        </svg>
        <input type="text" id="header-search-input" class="header-search-input" placeholder="Search requests..." autocomplete="off" spellcheck="false">
      </div>

      <!-- Action Button: Only Search 🔍 in default state, Close ✕ in search mode -->
      <button class="header-action-btn" id="header-action-btn" aria-label="Search Requests">
        <svg class="icon-search" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7.5"/>
          <line x1="21" y1="21" x2="16.5" y2="16.5"/>
        </svg>
        <svg class="icon-close" viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </header>

    <main class="page-content">
      <!-- Requests List Container -->
      <div id="requests-list">
        <!-- Rendered dynamically -->
      </div>
    </main>

    <!-- Floating Action Button matching Screenshot 2 -->
    <button class="fab-new-btn" id="open-modal-fab" aria-label="Add Holiday/Permission Request">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>

  <!-- Holiday/Permission Request Modal matching Screenshot 1 & 3 -->
  <div class="modal-overlay" id="request-modal">
    <div class="modal-card" onclick="event.stopPropagation()">
      <button class="modal-close-btn" id="close-modal-btn" aria-label="Close modal">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>

      <div class="modal-title">Holiday/Permission Request</div>

      <form id="new-req-form" onsubmit="handleRequestSubmit(event)">
        <!-- Type Dropdown matching Screenshot 1 exactly -->
        <div class="form-group-pill">
          <select id="modal-req-type" class="pill-select" required>
            <option value="" disabled selected>Select</option>
            <option value="Holiday">Holiday</option>
            <option value="Leave">Leave</option>
            <option value="Semester Holiday">Semester Holiday</option>
            <option value="Interview">Interview</option>
            <option value="Symposium">Symposium</option>
            <option value="NPTL/Gate">NPTL/Gate</option>
            <option value="Industrial Visit">Industrial Visit</option>
            <option value="Sports">Sports</option>
            <option value="Outing">Outing</option>
          </select>
          <svg style="width:20px;height:20px;color:#6b7280;pointer-events:none;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>

        <!-- Row 1: From | Time Out -->
        <div class="form-dt-row">
          <div class="form-dt-col">
            <svg class="form-dt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span class="form-dt-divider">|</span>
            <input type="text" id="modal-from-date" class="form-dt-input" placeholder="From" onfocus="(this.type='date')" onblur="if(!this.value)this.type='text'" required>
          </div>

          <div class="form-dt-col">
            <svg class="form-dt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            <span class="form-dt-divider">|</span>
            <input type="text" id="modal-from-time" class="form-dt-input" placeholder="Time Out" onfocus="(this.type='time')" onblur="if(!this.value)this.type='text'" required>
          </div>

          <div class="cal-badge-wrap" onclick="document.getElementById('modal-from-date').focus();document.getElementById('modal-from-date').showPicker?.()">
            <svg class="cal-badge-icon" viewBox="0 0 36 36">
              <rect x="4" y="6" width="28" height="26" rx="5" fill="#f87171"/>
              <rect x="4" y="14" width="28" height="18" rx="2" fill="#ffffff"/>
              <circle cx="10" cy="19" r="1.5" fill="#cbd5e1"/>
              <circle cx="18" cy="19" r="1.5" fill="#cbd5e1"/>
              <circle cx="26" cy="19" r="1.5" fill="#cbd5e1"/>
              <circle cx="10" cy="25" r="1.5" fill="#cbd5e1"/>
              <circle cx="26" cy="26" r="7" fill="#22c55e"/>
              <line x1="26" y1="22" x2="26" y2="30" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
              <line x1="22" y1="26" x2="30" y2="26" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
        </div>

        <!-- Row 2: To | Time In -->
        <div class="form-dt-row">
          <div class="form-dt-col">
            <svg class="form-dt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span class="form-dt-divider">|</span>
            <input type="text" id="modal-to-date" class="form-dt-input" placeholder="To" onfocus="(this.type='date')" onblur="if(!this.value)this.type='text'" required>
          </div>

          <div class="form-dt-col">
            <svg class="form-dt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            <span class="form-dt-divider">|</span>
            <input type="text" id="modal-to-time" class="form-dt-input" placeholder="Time In" onfocus="(this.type='time')" onblur="if(!this.value)this.type='text'" required>
          </div>

          <div class="cal-badge-wrap" onclick="document.getElementById('modal-to-date').focus();document.getElementById('modal-to-date').showPicker?.()">
            <svg class="cal-badge-icon" viewBox="0 0 36 36">
              <rect x="4" y="6" width="28" height="26" rx="5" fill="#f87171"/>
              <rect x="4" y="14" width="28" height="18" rx="2" fill="#ffffff"/>
              <circle cx="10" cy="19" r="1.5" fill="#cbd5e1"/>
              <circle cx="18" cy="19" r="1.5" fill="#cbd5e1"/>
              <circle cx="26" cy="19" r="1.5" fill="#cbd5e1"/>
              <circle cx="10" cy="25" r="1.5" fill="#cbd5e1"/>
              <circle cx="26" cy="26" r="7" fill="#22c55e"/>
              <line x1="26" y1="22" x2="26" y2="30" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
              <line x1="22" y1="26" x2="30" y2="26" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
        </div>

        <!-- Reason Input -->
        <input type="text" id="modal-reason" class="form-reason-box" placeholder="Enter Reason here" required>

        <!-- Submit Button -->
        <div class="btn-submit-wrap">
          <button type="submit" class="btn-submit-modal">SUBMIT</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/firebase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Rules defined by User:
    // 1. Single-stage (Warden only): Holiday, Outing
    // 2. Three-stage (Class Teacher -> HOD -> Warden): Leave, Semester Holiday, Interview, Symposium, NPTL/Gate, Industrial Visit, Sports
    const SINGLE_STAGE_TYPES = ['Holiday', 'Outing'];
    const THREE_STAGE_TYPES = [
      'Leave',
      'Semester Holiday',
      'Interview',
      'Symposium',
      'NPTL/Gate',
      'Industrial Visit',
      'Sports'
    ];

    const STORAGE_KEY = 'mei_student_requests_v5';

    // Initial Requests matching User Screenshot 1 (Reference)
    const INITIAL_REQUESTS = [
      {
        id: 'req_1',
        fromDate: '01-10-2026',
        fromTime: '05:00 PM',
        toDate: '04-10-2026',
        toTime: '05:00 PM',
        timestamp: '05-10-2026 06:25:44 PM',
        type: 'Holiday',
        place: 'home',
        status: 'approved',
        stage: 1
      },
      {
        id: 'req_2',
        fromDate: '25-09-2026',
        fromTime: '06:00 AM',
        toDate: '25-09-2026',
        toTime: '05:00 PM',
        timestamp: '2026-09-30T13:50:41.623926Z',
        type: 'Symposium',
        place: 'kavery Engineering College',
        status: 'approved',
        stage: 3
      },
      {
        id: 'req_3',
        fromDate: '20-09-2026',
        fromTime: '04:15 PM',
        toDate: '20-09-2026',
        toTime: '05:00 PM',
        timestamp: '30-09-2026 07:20:41 PM',
        type: 'Outing',
        place: 'Store',
        status: 'approved',
        stage: 1
      },
      {
        id: 'req_4',
        fromDate: '17-09-2026',
        fromTime: '07:45 AM',
        toDate: '17-09-2026',
        toTime: '05:00 PM',
        timestamp: '2026-09-24T06:09:28.714057Z',
        type: 'Symposium',
        place: 'Annapoorana engineering college',
        status: 'approved',
        stage: 3
      }
    ];

    let requests = [];

    function initRequests() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          requests = JSON.parse(stored);
        } catch(e) {
          requests = [...INITIAL_REQUESTS];
        }
      } else {
        // Check legacy keys
        const oldV4 = localStorage.getItem('mei_student_requests_v4');
        const oldV2 = localStorage.getItem('mei_student_requests_v2');
        if (oldV4) {
          try {
            requests = JSON.parse(oldV4);
            const r0 = requests.find(r => r.id === 'req_0');
            if (r0 && r0.status !== 'approved') {
              r0.status = 'approved';
              r0.stage = 3;
            }
          } catch(e) {
            requests = [...INITIAL_REQUESTS];
          }
        } else if (oldV2) {
          try {
            requests = JSON.parse(oldV2);
          } catch(e) {
            requests = [...INITIAL_REQUESTS];
          }
        } else {
          requests = [...INITIAL_REQUESTS];
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(requests));
      }
      renderRequests(requests);
    }

    function isSingleStage(type) {
      return SINGLE_STAGE_TYPES.includes(type);
    }

    function renderRequests(data) {
      const container = document.getElementById('requests-list');
      if (!data || data.length === 0) {
        container.innerHTML = `
          <div style="text-align:center;padding:50px 20px;color:#6b7280;font-weight:600">
            No requests found. Tap '+' to create a request.
          </div>
        `;
        return;
      }

      container.innerHTML = data.map(req => {
        const isSingle = isSingleStage(req.type);
        const isApproved = req.status === 'approved';
        const cardClass = isApproved ? 'is-approved' : 'is-pending';

        // Stepper generation for 3-stage requests matching Screenshot 1
        let stepperHTML = '';
        if (!isSingle) {
          const s = req.stage || 0;
          // Step 1: Class Teacher
          const dot1HTML = s >= 1 
            ? `<div class="step-dot-approved" title="Class Teacher: Approved"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>`
            : `<div class="step-dot-pending" onclick="simulateApproval('${req.id}', event)" title="Class Teacher: Pending"></div>`;
          
          // Line 1: between Step 1 and Step 2
          const line1Class = s >= 1 ? 'line-green' : 'line-gray';

          // Step 2: HOD
          const dot2HTML = s >= 2 
            ? `<div class="step-dot-approved" title="HOD: Approved"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>`
            : `<div class="step-dot-pending" onclick="simulateApproval('${req.id}', event)" title="HOD: Pending"></div>`;

          // Line 2: between Step 2 and Step 3
          const line2Class = s >= 2 ? 'line-green' : 'line-gray';

          // Step 3: Warden
          const dot3HTML = s >= 3 
            ? `<div class="step-dot-approved" title="Warden: Approved"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>`
            : `<div class="step-dot-pending" onclick="simulateApproval('${req.id}', event)" title="Warden: Pending"></div>`;

          stepperHTML = `
            <div class="req-stepper-wrap">
              <div class="req-stepper-track">
                <div class="stepper-line stepper-line-1 ${line1Class}"></div>
                <div class="stepper-line stepper-line-2 ${line2Class}"></div>
                ${dot1HTML}
                ${dot2HTML}
                ${dot3HTML}
              </div>
            </div>
          `;
        }

        // Delete button only shown when pending approval
        const deleteBtnHTML = !isApproved ? `
          <button class="req-delete-btn" onclick="deleteRequest('${req.id}', event)" title="Cancel Request">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          </button>
        ` : '';

        // Status row
        const statusText = req.status ? (req.status.charAt(0).toUpperCase() + req.status.slice(1)) : 'Approved';
        const statusRowHTML = `
          <div class="req-detail-row">
            <svg class="req-icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              <line x1="8" y1="9" x2="16" y2="9"/>
              <line x1="8" y1="13" x2="13" y2="13"/>
            </svg>
            <span class="req-status-text">${statusText}</span>
          </div>
        `;

        // Interactive simulation action bar when pending
        let actionHelperHTML = '';
        if (!isApproved) {
          if (isSingle) {
            actionHelperHTML = `
              <div class="req-action-bar">
                <button class="btn-advance-step" onclick="simulateApproval('${req.id}', event)">
                  ✓ Approve (Warden)
                </button>
              </div>
            `;
          } else {
            const s = req.stage || 0;
            const nextRoles = ['Class Teacher', 'HOD', 'Warden'];
            const nextRole = nextRoles[s] || 'Warden';
            actionHelperHTML = `
              <div class="req-action-bar">
                <button class="btn-advance-step" onclick="simulateApproval('${req.id}', event)">
                  ✓ Approve (${nextRole})
                </button>
              </div>
            `;
          }
        }

        return `
          <div class="req-card ${cardClass}" id="card-${req.id}">
            ${deleteBtnHTML}
            <div class="req-card-content">
              <!-- Row 1: From -->
              <div class="req-info-row">
                <span class="req-field-label">From :</span>
                <div class="req-date-time-wrap">
                  <svg class="req-icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                  </svg>
                  <span>${req.fromDate}</span>
                  <span class="req-divider">|</span>
                  <svg class="req-icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                  </svg>
                  <span>${req.fromTime}</span>
                </div>
              </div>

              <!-- Row 2: To -->
              <div class="req-info-row">
                <span class="req-field-label">To :</span>
                <div class="req-date-time-wrap">
                  <svg class="req-icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                  </svg>
                  <span>${req.toDate}</span>
                  <span class="req-divider">|</span>
                  <svg class="req-icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                  </svg>
                  <span>${req.toTime}</span>
                </div>
              </div>

              <!-- Row 3: Timestamp -->
              <div class="req-timestamp-row">
                <svg class="req-icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
                <span>${req.timestamp}</span>
              </div>

              <!-- Row 4: Type -->
              <div class="req-detail-row">
                <svg class="req-icon-small req-icon-user" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <span>${req.type}</span>
              </div>

              <!-- Row 5: Place / Reason -->
              <div class="req-detail-row">
                <svg class="req-icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                  <line x1="8" y1="9" x2="16" y2="9"/>
                  <line x1="8" y1="13" x2="13" y2="13"/>
                </svg>
                <span>${req.place || req.reason || ''}</span>
              </div>

              <!-- Row 6: Status -->
              ${statusRowHTML}

              <!-- Row 7: Stepper if 3-stage -->
              ${stepperHTML}

              <!-- Helper action bar for interactive testing -->
              ${actionHelperHTML}
            </div>
          </div>
        `;
      }).join('');
    }

    // Modal Controls
    const modal = document.getElementById('request-modal');
    const openFab = document.getElementById('open-modal-fab');
    const closeBtn = document.getElementById('close-modal-btn');

    if (openFab && modal) {
      openFab.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        modal.classList.add('show');
      });
    }

    if (closeBtn && modal) {
      closeBtn.addEventListener('click', (e) => {
        e.preventDefault();
        modal.classList.remove('show');
      });
    }

    if (modal) {
      modal.addEventListener('click', (e) => {
        if (e.target === modal || !e.target.closest('.modal-card')) {
          modal.classList.remove('show');
        }
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal && modal.classList.contains('show')) {
        modal.classList.remove('show');
      }
    });

    // Search Controls matching Screenshot 1
    const appHeader = document.getElementById('app-header');
    const headerActionBtn = document.getElementById('header-action-btn');
    const headerSearchInput = document.getElementById('header-search-input');
    const headerBackBtn = document.getElementById('header-back-btn');

    let isSearchActive = false;

    function openSearch() {
      isSearchActive = true;
      appHeader.classList.add('search-mode');
      headerActionBtn.setAttribute('aria-label', 'Close Search');
      setTimeout(() => {
        headerSearchInput.focus();
      }, 50);
    }

    function closeSearch() {
      if (!isSearchActive) return;
      isSearchActive = false;
      appHeader.classList.remove('search-mode');
      headerActionBtn.setAttribute('aria-label', 'Search Requests');
      headerSearchInput.value = '';
      renderRequests(requests);
    }

    headerActionBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (isSearchActive) {
        closeSearch();
      } else {
        openSearch();
      }
    });

    headerBackBtn.addEventListener('click', (e) => {
      if (isSearchActive) {
        e.preventDefault();
        closeSearch();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isSearchActive) {
        closeSearch();
      }
    });

    headerSearchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        renderRequests(requests);
        return;
      }
      const filtered = requests.filter(r => 
        (r.type && r.type.toLowerCase().includes(q)) || 
        (r.place && r.place.toLowerCase().includes(q)) || 
        (r.reason && r.reason.toLowerCase().includes(q)) ||
        (r.fromDate && r.fromDate.toLowerCase().includes(q)) ||
        (r.toDate && r.toDate.toLowerCase().includes(q)) ||
        (r.status && r.status.toLowerCase().includes(q))
      );
      renderRequests(filtered);
    });

    function formatTimeDisplay(timeStr) {
      if (!timeStr) return '05:00 PM';
      const [h, m] = timeStr.split(':');
      let hour = parseInt(h, 10);
      const ampm = hour >= 12 ? 'PM' : 'AM';
      hour = hour % 12 || 12;
      return `${String(hour).padStart(2, '0')}:${m} ${ampm}`;
    }

    function formatDateDisplay(dateStr) {
      if (!dateStr) return '06-10-2026';
      const [y, m, d] = dateStr.split('-');
      return `${d}-${m}-${y}`;
    }

    function handleRequestSubmit(e) {
      e.preventDefault();
      const type = document.getElementById('modal-req-type').value;
      const fromDate = document.getElementById('modal-from-date').value;
      const fromTime = document.getElementById('modal-from-time').value;
      const toDate = document.getElementById('modal-to-date').value;
      const toTime = document.getElementById('modal-to-time').value;
      const reason = document.getElementById('modal-reason').value;

      const now = new Date();
      const newReq = {
        id: 'req_' + Date.now(),
        fromDate: formatDateDisplay(fromDate),
        fromTime: formatTimeDisplay(fromTime),
        toDate: formatDateDisplay(toDate),
        toTime: formatTimeDisplay(toTime),
        timestamp: now.toISOString(),
        type: type,
        place: reason,
        status: 'pending',
        stage: 0
      };

      requests.unshift(newReq);
      saveRequests();
      renderRequests(requests);

      modal.classList.remove('show');
      document.getElementById('new-req-form').reset();
      
      if (isSingleStage(type)) {
        Toast.show(`${type} request submitted! Pending Warden approval.`, 'info');
      } else {
        Toast.show(`${type} request submitted! Pending Class Teacher approval.`, 'info');
      }
    }

    function deleteRequest(id, e) {
      e.stopPropagation();
      Confirm.show({
        title: 'Cancel Request',
        message: 'Are you sure you want to cancel this request?',
        icon: 'danger',
        confirmText: 'Yes, Cancel',
        cancelText: 'Keep',
        danger: true,
        onConfirm: () => {
          requests = requests.filter(r => r.id !== id);
          saveRequests();
          renderRequests(requests);
          Toast.show('Request cancelled successfully!', 'success');
        }
      });
    }

    function simulateApproval(id, e) {
      e.stopPropagation();
      const req = requests.find(r => r.id === id);
      if (!req) return;

      if (isSingleStage(req.type)) {
        // Single-stage: Warden approves directly
        req.status = 'approved';
        req.stage = 1;
        saveRequests();
        renderRequests(requests);
        Toast.show(`Warden Approved! Curved shape turned to Mint Green.`, 'success');
      } else {
        // Three-stage: Class Teacher -> HOD -> Warden
        let s = req.stage || 0;
        if (s === 0) {
          req.stage = 1;
          Toast.show(`Class Teacher Approved! Next: HOD.`, 'info');
        } else if (s === 1) {
          req.stage = 2;
          Toast.show(`HOD Approved! Next: Warden.`, 'info');
        } else if (s === 2) {
          req.stage = 3;
          req.status = 'approved';
          Toast.show(`Warden Approved! Fully approved, shape turned to Mint Green!`, 'success');
        }
        saveRequests();
        renderRequests(requests);
      }
    }

    function saveRequests() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(requests));
      localStorage.setItem('mei_student_requests_v4', JSON.stringify(requests));
      localStorage.setItem('mei_student_requests_v2', JSON.stringify(requests));
    }

    // Always reload from storage when page is shown (e.g. returning from Dashboard)
    window.addEventListener('pageshow', () => {
      initRequests();
    });

    document.addEventListener('DOMContentLoaded', () => {
      initRequests();
      PageLoader.hide();
    });
  </script>
</body>
</html>
