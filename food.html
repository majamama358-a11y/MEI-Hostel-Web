<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <style>
    .food-card-full {
      background: #fff;
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 14px;
      animation: slideUp 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
      overflow: hidden;
      position: relative;
    }

    .meal-icon-box {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      flex-shrink: 0;
    }
    .meal-icon-box.Breakfast { background: linear-gradient(135deg, #FEF3C7, #FDE68A); }
    .meal-icon-box.Lunch { background: linear-gradient(135deg, #DCFCE7, #BBF7D0); }
    .meal-icon-box.Dinner { background: linear-gradient(135deg, #EDE9FE, #DDD6FE); }

    .meal-emoji { pointer-events: none; }

    .food-type-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 700;
    }
    .food-type-chip.Veg { background: #DCFCE7; color: #15803D; }
    .food-type-chip.Non-Veg { background: #FEE2E2; color: #B91C1C; }

    .food-choice-btns {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .food-choice-btn {
      flex: 1;
      padding: 10px 8px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 700;
      border: 2px solid var(--border);
      background: #fff;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: center;
      font-family: 'Nunito', sans-serif;
    }

    .food-choice-btn.selected-veg {
      border-color: var(--success);
      background: var(--success-light);
      color: #15803D;
    }

    .food-choice-btn.selected-nonveg {
      border-color: var(--danger);
      background: var(--danger-light);
      color: #B91C1C;
    }

    .food-choice-btn.selected-nofood {
      border-color: var(--cancelled);
      background: var(--cancelled-light);
      color: #475569;
    }

    .food-deadline {
      font-size: 0.75rem;
      color: var(--warning);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
    }

    .food-menu-text {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-top: 6px;
      line-height: 1.4;
    }

    .selected-indicator {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--success);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity var(--transition-fast);
    }
    .selected-indicator.show { opacity: 1; }
    .selected-indicator svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>

  <script>
    initFirebase();
    const DEFAULT_FOOD = [
      { id: 'food_001', meal: 'Lunch', date: 'Today', type: 'Veg', menu: 'Rice, Sambar, Rasam, Vegetable Curry, Curd', createdAt: '12:30 PM', selected: 'veg' },
      { id: 'food_002', meal: 'Dinner', date: 'Today', type: 'Veg', menu: 'Chapati, Dal, Mixed Veg, Pickle', createdAt: '07:30 PM', selected: null },
      { id: 'food_003', meal: 'Breakfast', date: 'Tomorrow', type: 'Veg', menu: 'Idli, Vada, Sambhar, Chutney', createdAt: '07:00 AM', selected: null }
    ];
    let foodItems = [...DEFAULT_FOOD];
    let currentUser = null;

    const mealEmoji = { Breakfast: '🌅', Lunch: '🍽️', Dinner: '🌙' };

    const session = typeof checkSession === 'function' ? checkSession() : { valid: false };
    if (session.valid && session.user) {
      currentUser = session.user;
      renderFood(foodItems);
      PageLoader.hide();
    } else if (typeof firebase !== 'undefined' && auth) {
      auth.onAuthStateChanged(async user => {
        if (user) {
          currentUser = user;
          await loadFoodFromFirebase(user.uid);
        } else window.location.href = 'login.html';
      });
    } else {
      window.location.href = 'login.html';
    }

    async function loadFoodFromFirebase(uid) {
      try {
        const snap = await DB.food().once('value');
        if (snap.exists()) {
          foodItems = Object.entries(snap.val()).map(([id, f]) => ({ id, ...f }));
          // Load user selections
          const selSnap = await DB.foodSelections().orderByChild('userId').equalTo(uid).once('value');
          if (selSnap.exists()) {
            const sels = selSnap.val();
            Object.values(sels).forEach(sel => {
              const food = foodItems.find(f => f.id === sel.foodId);
              if (food) food.selected = sel.selection;
            });
          }
        }
      } catch(e) { console.warn('Using demo data'); }
      renderFood(foodItems);
      PageLoader.hide();
    }

    function renderFood(foods) {
      const container = document.getElementById('food-list');
      if (foods.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon" style="width:100px;height:100px">
              <span style="font-size:3rem">🍽️</span>
            </div>
            <div class="empty-title">No food choices available</div>
            <div class="empty-subtitle">Food menu will be posted by the hostel staff.</div>
          </div>`;
        return;
      }

      container.innerHTML = foods.map((food, idx) => `
        <div class="food-card-full" id="food-card-${food.id}" style="animation-delay:${idx * 0.07}s">
          <div class="selected-indicator ${food.selected ? 'show' : ''}" id="check-${food.id}">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
            <div class="meal-icon-box ${food.meal}">
              <span class="meal-emoji">${mealEmoji[food.meal] || '🍽️'}</span>
            </div>
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
                <span style="font-family:'Nunito';font-size:1.05rem;font-weight:800;color:var(--text-primary)">${food.meal}</span>
                <span class="food-type-chip ${food.type}">${food.type === 'Veg' ? '🥦' : '🍖'} ${food.type}</span>
              </div>
              <div style="font-size:0.82rem;color:var(--text-secondary);font-weight:600">📅 ${food.date}</div>
              <div class="food-menu-text">${food.menu}</div>
            </div>
          </div>
          <div style="font-size:0.72rem;color:var(--text-muted);margin-bottom:10px">Created: ${food.createdAt}</div>

          ${food.selected ? `
            <div style="background:var(--success-light);border-radius:var(--radius-xs);padding:8px 12px;font-size:0.85rem;color:#15803D;font-weight:700;display:flex;align-items:center;gap:6px">
              <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><polyline points="20 6 9 17 4 12"/></svg>
              You chose: <strong>${food.selected === 'veg' ? 'Veg 🥦' : food.selected === 'nonveg' ? 'Non-Veg 🍖' : 'No Food 🚫'}</strong>
            </div>` : `
          <div class="food-choice-btns">
            <button class="food-choice-btn" onclick="selectFood('${food.id}', 'veg')">🥦 Veg</button>
            <button class="food-choice-btn" onclick="selectFood('${food.id}', 'nonveg')">🍖 Non-Veg</button>
            <button class="food-choice-btn" onclick="selectFood('${food.id}', 'nofood')">🚫 No Food</button>
          </div>`}
        </div>
      `).join('');
    }

    async function selectFood(foodId, choice) {
      const food = foodItems.find(f => f.id === foodId);
      if (!food) return;

      const card = document.getElementById(`food-card-${foodId}`);
      const btns = card.querySelectorAll('.food-choice-btn');
      btns.forEach(b => { b.disabled = true; b.style.opacity = '0.6'; });

      await new Promise(r => setTimeout(r, 600));

      // Save to Firebase
      try {
        if (typeof firebase !== 'undefined' && auth && auth.currentUser) {
          await DB.userFoodSelection(auth.currentUser.uid, foodId).set({
            userId: auth.currentUser.uid,
            foodId,
            selection: choice,
            createdAt: DateUtil.format(new Date(), 'datetime')
          });
        }
      } catch(e) { console.warn('Firebase save failed'); }

      food.selected = choice;
      
      const labels = { veg: 'Veg 🥦', nonveg: 'Non-Veg 🍖', nofood: 'No Food 🚫' };
      Toast.success(`${food.meal} preference set: ${labels[choice]}`);
      renderFood(foodItems);
    }

    document.getElementById('drawer-logout-btn').addEventListener('click', () => {
      Confirm.show({ title: 'Logout', message: 'Are you sure?', icon: 'warning', confirmText: 'Logout', cancelText: 'Stay', danger: true,
        onConfirm: () => {
          if (typeof clearSessionAndRedirect === 'function') clearSessionAndRedirect();
          else { sessionStorage.clear(); window.location.href = 'login.html'; }
        }
      });
    });
  </script>
