<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2878C8">
  <meta name="description" content="Mahendra Hostel - Student Management App for Mahendra Engineering College">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="M Hostel">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Login – Mahendra Hostel</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    /* Screenshot 1 Match Styling */
    body {
      background-color: #1e1864;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', 'Inter', sans-serif;
    }

    .login-page {
      flex: 1;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #1e1864;
      background-image: radial-gradient(circle 420px at 85% 15%, #46379c 0%, #2e237c 50%, #1e1864 80%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
      position: relative;
      overflow: hidden;
    }

    /* Soft curved glow in top right matching Screenshot 1 */
    .login-page::before {
      content: '';
      position: absolute;
      top: -80px;
      right: -80px;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(120, 95, 195, 0.4) 0%, rgba(30, 24, 100, 0) 70%);
      pointer-events: none;
    }

    .login-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 38px 24px 34px;
      width: 100%;
      max-width: 370px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
      position: relative;
      z-index: 10;
      animation: loginCardUp 0.4s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }

    @keyframes loginCardUp {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 22px;
    }

    .login-brand-logo {
      width: 95px;
      height: auto;
      object-fit: contain;
      margin-bottom: 12px;
    }

    .login-brand-title {
      font-family: 'Nunito', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: #2b1f6d;
      letter-spacing: 0.5px;
      text-align: center;
      margin: 0 0 6px 0;
    }

    .login-brand-subtitle {
      font-family: 'Nunito', sans-serif;
      font-size: 0.85rem;
      font-weight: 800;
      color: #1f1854;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .login-input-wrap {
      display: flex;
      align-items: center;
      background: #faf8ff;
      border: 1.5px solid #aba0d7;
      border-radius: 20px;
      padding: 0 16px;
      height: 52px;
      margin-bottom: 16px;
      transition: all 0.2s ease;
    }

    .login-input-wrap:focus-within {
      border-color: #684ea6;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(104, 78, 166, 0.15);
    }

    .login-input-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .login-input-icon svg {
      width: 20px;
      height: 20px;
      stroke: #684ea6;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .login-input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'Nunito', sans-serif;
      font-size: 0.96rem;
      font-weight: 600;
      color: #2b1f6d;
      width: 100%;
    }

    .login-input-field::placeholder {
      color: #8c86a6;
      font-weight: 500;
    }

    .login-eye-toggle {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #8c86a6;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-btn-submit {
      width: 125px;
      height: 44px;
      background: #231c6b;
      color: #ffffff;
      font-family: 'Nunito', sans-serif;
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      border-radius: 12px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 24px auto 0 auto;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(35, 28, 107, 0.35);
      transition: all 0.15s ease;
    }

    .login-btn-submit:hover {
      background: #1b1559;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(35, 28, 107, 0.45);
    }

    .login-btn-submit:active {
      transform: scale(0.97);
    }

    .login-error-msg {
      display: none;
      background: #fee2e2;
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: #b91c1c;
      font-weight: 600;
      margin-bottom: 16px;
      align-items: center;
      gap: 8px;
    }

    .login-error-msg.show {
      display: flex;
    }

    .login-error-msg svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

  </style>
</head>
<body>
  <!-- Page Loader -->
  <div id="page-loader" class="page-loader hidden">
    <div class="loader-logo">
      <img src="assets/icons/mei-logo.png" alt="MEI Logo" style="width:48px;height:auto">
    </div>
    <div class="spinner"></div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Confirm Dialog -->
  <div id="confirm-dialog" class="confirm-dialog"></div>

  <!-- Login Page matching Screenshot 1 -->
  <div class="login-page">
    <div class="login-card">
      <!-- Logo + App Name matching Screenshot 1 -->
      <div class="login-brand-header">
        <img src="assets/icons/mei-logo.png" alt="Mahendra Educational Institutions" class="login-brand-logo">
        <h1 class="login-brand-title">MAHENDRA HOSTEL</h1>
        <div class="login-brand-subtitle">LOGIN</div>
      </div>

      <!-- Error message -->
      <div id="login-error" class="login-error-msg">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="login-error-text">Invalid username or password</span>
      </div>

      <!-- Login Form matching Screenshot 1 -->
      <form id="login-form" novalidate autocomplete="on">
        <!-- Username Field with purple person icon -->
        <div class="login-input-wrap">
          <div class="login-input-icon">
            <svg viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <input
            type="text"
            id="login-username"
            class="login-input-field"
            placeholder="Username"
            autocomplete="username"
            autocapitalize="off"
            spellcheck="false"
            required
          >
        </div>

        <!-- Password Field with purple padlock icon and toggle eye -->
        <div class="login-input-wrap">
          <div class="login-input-icon">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <input
            type="password"
            id="login-password"
            class="login-input-field"
            placeholder="Password"
            autocomplete="current-password"
            required
          >
          <button type="button" class="login-eye-toggle" id="toggle-password" aria-label="Toggle password visibility">
            <svg id="eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <!-- Submit Button: Centered solid navy button matching Screenshot 1 -->
        <button type="submit" id="login-btn" class="login-btn-submit">
          LOGIN
        </button>
      </form>

    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script src="js/firebase.js?v=1.3"></script>
  <script src="js/utils.js?v=1.3"></script>
  <script src="js/auth.js?v=1.3"></script>

  <script>
    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(console.error);
    }

    // Toggle password visibility
    const toggleBtn = document.getElementById('toggle-password');
    const passInput = document.getElementById('login-password');
    const eyeIcon = document.getElementById('eye-icon');

    toggleBtn.addEventListener('click', () => {
      const isText = passInput.type === 'text';
      passInput.type = isText ? 'password' : 'text';
      eyeIcon.innerHTML = isText
        ? `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`
        : `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;
    });

    // Init Firebase & Master Owner Seed
    initFirebase();
    if (typeof seedMasterOwner === 'function') {
      seedMasterOwner();
    }

    // Check if already logged in
    const session = typeof checkSession === 'function' ? checkSession() : { valid: false };
    if (session.valid && session.user) {
      const redirectUrl = typeof getRoleRedirectURL === 'function' 
        ? getRoleRedirectURL(session.user.role)
        : (session.user.role === 'owner' ? 'owner-panel.html' : (session.user.role === 'admin' ? 'admin-panel.html' : 'dashboard.html'));
      window.location.href = redirectUrl;
    }

    // Login form submission
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = (document.getElementById('login-username').value || '').trim();
      const password = (document.getElementById('login-password').value || '').trim();
      const btn = document.getElementById('login-btn');
      const errorEl = document.getElementById('login-error');
      const errorText = document.getElementById('login-error-text');

      if (!username || !password) {
        errorText.textContent = 'Please enter both username and password.';
        errorEl.classList.add('show');
        return;
      }

      // Set loading state
      btn.innerHTML = '<span class="btn-spinner"></span> LOGGING IN...';
      btn.disabled = true;
      errorEl.classList.remove('show');

      // Simulate short network delay for smooth UX
      await new Promise(r => setTimeout(r, 450));

      // Authenticate against Firebase / Local DB
      const user = typeof authenticateUser === 'function' ? authenticateUser(username, password) : null;

      if (user) {
        if (user.status === 'disabled') {
          errorText.textContent = 'Your account has been disabled. Please contact the hostel administration.';
          errorEl.classList.add('show');
          btn.innerHTML = 'LOGIN';
          btn.disabled = false;
          return;
        }

        // Save session
        if (typeof setSessionUser === 'function') {
          setSessionUser(user);
        } else {
          sessionStorage.setItem('mei_auth_session', JSON.stringify(user));
        }

        // Activity log
        if (typeof logActivity === 'function') {
          logActivity(user.uid, 'LOGIN', `${user.name} logged into ${user.role} portal`);
        }

        Toast.success(`Welcome, ${user.name}!`);

        const targetPage = typeof getRoleRedirectURL === 'function'
          ? getRoleRedirectURL(user.role)
          : (user.role === 'owner' ? 'owner-panel.html' : (user.role === 'admin' ? 'admin-panel.html' : 'dashboard.html'));

        setTimeout(() => {
          window.location.href = targetPage;
        }, 400);
      } else {
        errorText.textContent = 'Invalid username or password.';
        errorEl.classList.add('show');
        btn.innerHTML = 'LOGIN';
        btn.disabled = false;
      }
    });

    const forgotLink = document.getElementById('forgot-link');
    if (forgotLink) {
      forgotLink.addEventListener('click', (e) => {
        e.preventDefault();
        Toast.info('Please contact your hostel administration for password reset.');
      });
    }
  </script>
</body>
</html>
