<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1b63c2">
  <title>Emergency Request – Mahendra Hostel</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body {
      background: #fbfbfe;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
    }

    .app-page {
      background: #fbfbfe;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
    }

    /* Header matching Screenshot 4 */
    .app-header {
      background: linear-gradient(90deg, #1b63c2 0%, #3e1e82 100%) !important;
      padding: calc(var(--safe-top) + 12px) 16px 14px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: flex-start !important;
      gap: 16px !important;
      border-bottom: none !important;
      box-shadow: 0 2px 10px rgba(30, 20, 100, 0.2) !important;
    }

    .header-back-btn {
      background: none !important;
      border: none !important;
      cursor: pointer !important;
      padding: 6px !important;
      margin: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      color: #ffffff !important;
      border-radius: 8px !important;
      flex-shrink: 0 !important;
      text-decoration: none !important;
      transition: background 0.15s ease;
    }

    .header-back-btn:hover, .header-back-btn:active {
      background: rgba(255, 255, 255, 0.18) !important;
    }

    .header-back-btn svg {
      width: 24px;
      height: 24px;
      stroke: #ffffff;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .header-title-text {
      font-family: 'Fredoka', 'Nunito', sans-serif !important;
      font-size: 1.35rem !important;
      font-weight: 600 !important;
      color: #ffffff !important;
      letter-spacing: 0.3px !important;
      margin: 0 !important;
      text-align: left !important;
    }

    .page-content {
      padding: 16px 16px 90px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Floating Action Button matching Screenshot 4 */
    .fab-new-btn {
      position: fixed;
      right: 22px;
      bottom: 24px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #2b1d6f;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(43, 29, 111, 0.4);
      z-index: 50;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .fab-new-btn:hover {
      background: #392496;
      transform: scale(1.05);
    }

    .fab-new-btn:active {
      transform: scale(0.95);
    }

    .fab-new-btn svg {
      width: 28px;
      height: 28px;
      stroke: #ffffff;
      stroke-width: 2.8;
      stroke-linecap: round;
    }

    /* Request Card if emergency requests exist */
    .emergency-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(239, 68, 68, 0.2);
      animation: fadeIn 0.35s ease-out;
    }

    .emergency-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background: #ef4444;
    }

    .emergency-badge-top {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    /* Modal Bottom Sheet */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 12, 45, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 999;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 560px;
      padding: 24px 22px 36px;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.25);
      position: relative;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-sizing: border-box;
    }

    .modal-overlay.show .modal-card {
      transform: translateY(0);
    }

    .modal-close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      cursor: pointer;
      color: #ef4444;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    .modal-close-btn svg {
      width: 24px;
      height: 24px;
      stroke: #ef4444;
      stroke-width: 2.8;
      stroke-linecap: round;
    }

    .modal-title {
      text-align: center;
      font-family: 'Nunito', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: #111827;
      margin: 6px 0 24px;
    }

    .form-group-pill {
      border: 1.5px solid #c7d2fe;
      border-radius: 28px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      background: #ffffff;
      cursor: pointer;
    }

    .pill-select {
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #111827;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }

    .form-input-box {
      width: 100%;
      box-sizing: border-box;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 18px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      color: #111827;
      outline: none;
      margin-bottom: 18px;
      transition: border-color 0.2s ease;
    }

    .form-input-box:focus {
      border-color: #2b1d6f;
    }

    .btn-submit-modal {
      background: #2b1d6f;
      color: #ffffff;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 14px 44px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(43, 29, 111, 0.3);
      width: 100%;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn-submit-modal:hover {
      background: #392496;
    }
  </style>
</head>
<body>
  <!-- Page Loader -->
  <div id="page-loader" class="page-loader">
    <div class="loader-logo">
      <img src="assets/icons/mei-logo.png" alt="MEI Logo" style="width:48px;height:auto">
    </div>
    <div class="spinner"></div>
  </div>

  <div id="toast-container"></div>

  <div class="app-page">
    <!-- Header matching Screenshot 4 -->
    <header class="app-header">
      <a href="dashboard.html" class="header-back-btn" aria-label="Back to Dashboard">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <h1 class="header-title-text">Emergency Request</h1>
    </header>

    <!-- Page Content matching Screenshot 4 -->
    <main class="page-content" id="emergency-list-container">
      <!-- Empty state as shown in Screenshot 4 or active requests -->
    </main>

    <!-- Floating Action Button matching Screenshot 4 -->
    <button class="fab-new-btn" id="open-emergency-modal" aria-label="Submit Emergency Request">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>

  <!-- Emergency Request Modal -->
  <div class="modal-overlay" id="emergency-modal">
    <div class="modal-card">
      <button class="modal-close-btn" id="close-emergency-modal" aria-label="Close modal">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>

      <div class="modal-title">Emergency Request</div>

      <form id="emergency-form" onsubmit="handleEmergencySubmit(event)">
        <!-- Emergency Type -->
        <div class="form-group-pill">
          <select id="em-type" class="pill-select" required>
            <option value="" disabled selected>Select Emergency Type</option>
            <option value="Medical Emergency">🏥 Medical Emergency</option>
            <option value="Family Emergency">👨‍👩‍👧 Family Emergency</option>
            <option value="Accident / Urgent">🚨 Accident / Urgent</option>
            <option value="Other Emergency">⚠️ Other Emergency</option>
          </select>
          <svg style="width:20px;height:20px;color:#6b7280;pointer-events:none;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>

        <!-- Description -->
        <textarea id="em-desc" class="form-input-box" rows="3" placeholder="Describe the emergency situation..." required></textarea>

        <!-- Location -->
        <input type="text" id="em-location" class="form-input-box" placeholder="Current location or hospital destination" required>

        <!-- Phone -->
        <input type="tel" id="em-phone" class="form-input-box" placeholder="Contact mobile number" required>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit-modal">SUBMIT EMERGENCY</button>
      </form>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script>
    let emergencyRequests = [];

    function initEmergency() {
      const stored = localStorage.getItem('mei_emergency_requests');
      if (stored) {
        try {
          emergencyRequests = JSON.parse(stored);
        } catch(e) {
          emergencyRequests = [];
        }
      }
      renderEmergencyList();
    }

    function renderEmergencyList() {
      const container = document.getElementById('emergency-list-container');
      if (!emergencyRequests || emergencyRequests.length === 0) {
        // As shown in Screenshot 4: empty clean canvas
        container.innerHTML = '';
        return;
      }

      container.innerHTML = emergencyRequests.map(r => `
        <div class="emergency-card">
          <div class="emergency-badge-top">🚨 ${r.type}</div>
          <div style="font-weight:800;font-size:1.05rem;color:#111827;margin-bottom:6px">${r.description}</div>
          <div style="font-size:0.88rem;color:#4b5563;margin-bottom:4px">📍 ${r.location}</div>
          <div style="font-size:0.85rem;color:#6b7280;margin-bottom:10px">📞 ${r.phone} • ${r.time}</div>
          <div style="display:inline-block;padding:3px 10px;border-radius:12px;font-size:0.8rem;font-weight:700;background:#dcfce7;color:#15803d">
            ✓ Sent to Hostel Manager & Dean
          </div>
        </div>
      `).join('');
    }

    const modal = document.getElementById('emergency-modal');
    const openBtn = document.getElementById('open-emergency-modal');
    const closeBtn = document.getElementById('close-emergency-modal');

    openBtn.addEventListener('click', () => {
      modal.classList.add('show');
    });

    closeBtn.addEventListener('click', () => {
      modal.classList.remove('show');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('show');
    });

    function handleEmergencySubmit(e) {
      e.preventDefault();
      const type = document.getElementById('em-type').value;
      const desc = document.getElementById('em-desc').value;
      const location = document.getElementById('em-location').value;
      const phone = document.getElementById('em-phone').value;

      const newReq = {
        id: 'em_' + Date.now(),
        type: type,
        description: desc,
        location: location,
        phone: phone,
        time: new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })
      };

      emergencyRequests.unshift(newReq);
      localStorage.setItem('mei_emergency_requests', JSON.stringify(emergencyRequests));
      renderEmergencyList();

      modal.classList.remove('show');
      document.getElementById('emergency-form').reset();
      Toast.show('Emergency request submitted! Warden alerted.', 'success');
    }

    document.addEventListener('DOMContentLoaded', () => {
      initEmergency();
      PageLoader.hide();
    });
  </script>
</body>
</html>
