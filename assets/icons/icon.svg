<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2878C8"/>
      <stop offset="100%" style="stop-color:#42158F"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Building outline -->
  <rect x="136" y="88" width="240" height="324" rx="12" fill="none" stroke="white" stroke-width="20"/>
  <!-- Windows - Row 1 -->
  <rect x="176" y="136" width="60" height="72" rx="6" fill="rgba(255,255,255,0.3)"/>
  <rect x="276" y="136" width="60" height="72" rx="6" fill="rgba(255,255,255,0.3)"/>
  <!-- Windows - Row 2 -->
  <rect x="176" y="236" width="60" height="72" rx="6" fill="rgba(255,255,255,0.3)"/>
  <rect x="276" y="236" width="60" height="72" rx="6" fill="rgba(255,255,255,0.3)"/>
  <!-- Door -->
  <rect x="216" y="324" width="80" height="88" rx="8" fill="rgba(255,255,255,0.5)"/>
  <!-- Door handle -->
  <circle cx="285" cy="368" r="6" fill="rgba(255,255,255,0.8)"/>
  <!-- Roof line -->
  <line x1="120" y1="88" x2="392" y2="88" stroke="white" stroke-width="18" stroke-linecap="round"/>
  <!-- Floor line -->
  <line x1="100" y1="412" x2="412" y2="412" stroke="white" stroke-width="18" stroke-linecap="round"/>
</svg>
