<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2878C8">
  <meta name="description" content="Mahendra Hostel Dashboard">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Dashboard – Mahendra Hostel</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    /* Screenshot 2 Header Match */
    .app-header {
      background: linear-gradient(90deg, #1b63c2 0%, #3e1e82 100%) !important;
      padding: calc(var(--safe-top) + 12px) 16px 14px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: flex-start !important;
      gap: 16px !important;
      box-shadow: 0 2px 10px rgba(30, 20, 100, 0.2) !important;
    }

    .header-hamburger-btn {
      background: none !important;
      border: none !important;
      cursor: pointer !important;
      padding: 6px !important;
      margin: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      color: #ffffff !important;
      border-radius: 8px !important;
      flex-shrink: 0 !important;
      transition: background 0.15s ease;
    }

    .header-hamburger-btn:hover, .header-hamburger-btn:active {
      background: rgba(255, 255, 255, 0.18) !important;
    }

    .header-hamburger-btn svg {
      width: 24px;
      height: 24px;
      stroke: #ffffff;
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    .header-title-text {
      font-family: 'Nunito', sans-serif !important;
      font-size: 1.25rem !important;
      font-weight: 800 !important;
      color: #ffffff !important;
      letter-spacing: 0.2px !important;
      margin: 0 !important;
      flex: none !important;
      text-align: left !important;
    }

    /* Page Content & Welcome Hero matching User Screenshot */
    .app-page {
      background: #fbfbfe;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .page-content {
      background: #fbfbfe;
      min-height: calc(100vh - 60px);
      min-height: calc(100dvh - 60px);
      padding: 24px 20px;
    }

    .dash-welcome-hero {
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 12px 6px;
      animation: fadeIn 0.4s ease-out;
    }

    .dash-hero-logo {
      width: 76px;
      height: auto;
      object-fit: contain;
      flex-shrink: 0;
    }

    .dash-hero-text {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .dash-hero-greeting {
      font-family: 'Nunito', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: #111827;
      line-height: 1.2;
    }

    .dash-hero-name {
      font-family: 'Nunito', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: #2b1d6f;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    /* Location Permission Modal matching Screenshot 5 */
    .loc-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: fadeIn 0.2s ease-out;
    }

    .loc-modal-overlay.hidden {
      display: none !important;
    }

    .loc-modal-card {
      background: #424244;
      border-radius: 8px;
      padding: 24px 24px 18px 24px;
      width: 100%;
      max-width: 350px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
      animation: scaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .loc-modal-title {
      font-family: 'Fredoka', 'Nunito', sans-serif;
      font-size: 1.18rem;
      font-weight: 700;
      color: #d1d5db;
      margin: 0 0 14px 0;
      letter-spacing: 0.2px;
    }

    .loc-modal-body {
      font-family: 'Nunito', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }

    .loc-modal-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 20px;
    }

    .loc-modal-btn {
      background: none;
      border: none;
      color: #8b5cf6;
      font-family: 'Fredoka', 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      padding: 6px 8px;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .loc-modal-btn:hover {
      opacity: 0.85;
      transform: scale(1.05);
    }

    .loc-modal-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <!-- Page Loader (Matching Screenshot 3) -->
  <div id="page-loader" class="page-loader hidden">
    <div class="spinner"></div>
  </div>

  <!-- Location Permission Modal matching Screenshot 1 -->
  <div id="location-permission-modal" class="loc-modal-overlay" onclick="if(!event.target.closest('.loc-modal-card')) dismissLocationModal(false)">
    <div class="loc-modal-card" onclick="event.stopPropagation()">
      <h3 class="loc-modal-title">Location Permission Required</h3>
      <p class="loc-modal-body">
        This app needs background location access to track your attendance in the hostel even when you're not actively using the app.
      </p>
      <div class="loc-modal-actions">
        <button type="button" class="loc-modal-btn" onclick="dismissLocationModal(false)">CANCEL</button>
        <button type="button" class="loc-modal-btn" onclick="dismissLocationModal(true)">ALLOW</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Confirm Dialog -->
  <div id="confirm-dialog" class="confirm-dialog"></div>

  <!-- Drawer Overlay -->
  <div id="drawer-overlay" class="drawer-overlay"></div>

  <!-- Side Nav Drawer matching Screenshot 3 -->
  <nav id="nav-drawer" class="drawer" role="navigation" aria-label="Main Navigation">
    <div class="drawer-header">
      <div class="drawer-logo-card">
        <img src="assets/icons/mei-logo.png" alt="MEI Logo">
      </div>
      <div class="drawer-app-title">MEI Hostel</div>
    </div>

    <div class="drawer-nav">
      <!-- 1. Request List -->
      <a href="request.html" class="drawer-item ripple" data-page="request.html">
        <span class="drawer-item-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
          </svg>
        </span>
        <span class="drawer-item-text">Request List</span>
      </a>

      <!-- 2. Pass Timing -->
      <a href="pass-timing.html" class="drawer-item ripple" data-page="pass-timing.html">
        <span class="drawer-item-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
          </svg>
        </span>
        <span class="drawer-item-text">Pass Timing</span>
      </a>

      <!-- 3. Emergency Request -->
      <a href="emergency.html" class="drawer-item ripple" data-page="emergency.html">
        <span class="drawer-item-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-5-8h2v3h3v2h-3v3h-2v-3H9v-2h3V8z"/>
          </svg>
        </span>
        <span class="drawer-item-text">Emergency Request</span>
      </a>

      <!-- 4. Parcel Scan -->
      <a href="parcel.html" class="drawer-item ripple" data-page="parcel.html">
        <span class="drawer-item-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M2 9V4a2 2 0 0 1 2-2h5v2.5H4.5v4.5H2zm0 6v5a2 2 0 0 0 2 2h5v-2.5H4.5V15H2zm13 7h5a2 2 0 0 0 2-2v-5h-2.5v4.5H15V22zm5-13h2V4a2 2 0 0 0-2-2h-5v2.5h4.5V9H22zM7 7h3v3H7V7zm0 7h3v3H7v-3zm7-7h3v3h-3V7zm0 7h1.5v1.5H14V14zm1.5 1.5H17V17h-1.5v-1.5zm-1.5 1.5h1.5V18.5H14V17zm3-1.5H18.5V14H17v1.5z"/>
          </svg>
        </span>
        <span class="drawer-item-text">Parcel Scan</span>
      </a>

      <!-- 5. Food Choice -->
      <a href="food.html" class="drawer-item ripple" data-page="food.html">
        <span class="drawer-item-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M4 2h16a2.5 2.5 0 0 1 2.5 2.5v15a2.5 2.5 0 0 1-2.5 2.5H4A2.5 2.5 0 0 1 1.5 19.5v-15A2.5 2.5 0 0 1 4 2zm6.25 4.5v3.25c0 .6-.45 1.1-1.05 1.1v5.65H7.8V10.85c-.6 0-1.05-.5-1.05-1.1V6.5h.7v2.6h.5V6.5h.7v2.6h.5V6.5h1.1zm4.75-.25a1.8 1.8 0 0 0-1.8 1.8v3.95h.6v6.5h1.1v-6.5h.6V8.05c0-1-.8-1.8-1.8-1.8z"/>
          </svg>
        </span>
        <span class="drawer-item-text">Food Choice</span>
      </a>

      <!-- 6. Change Password -->
      <a href="change-password.html" class="drawer-item ripple" data-page="change-password.html">
        <span class="drawer-item-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M19.7 7.3c1.2-1.2 1.2-3.1 0-4.2-1.2-1.2-3.1-1.2-4.2 0L6.4 12.2c-.4.4-.7.9-.8 1.4L4.1 19c-.3 1 .6 1.9 1.6 1.6l5.4-1.5c.5-.1 1-.4 1.4-.8l9.2-9.2v-1.8zm-3.6-1.4a1.2 1.2 0 1 0-1.7-1.7 1.2 1.2 0 0 0 1.7 1.7z"/>
          </svg>
        </span>
        <span class="drawer-item-text">Change Password</span>
      </a>

      <!-- 7. Profile -->
      <a href="profile.html" class="drawer-item ripple" data-page="profile.html">
        <span class="drawer-item-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </span>
        <span class="drawer-item-text">Profile</span>
      </a>

      <!-- 8. Logout -->
      <a href="#" class="drawer-item ripple" id="drawer-logout-btn">
        <span class="drawer-item-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </span>
        <span class="drawer-item-text">Logout</span>
      </a>
    </div>
  </nav>

  <!-- Main App -->
  <div class="app-page">
    <!-- Header matching Screenshot 2 -->
    <header class="app-header">
      <button class="header-hamburger-btn" id="hamburger-btn" aria-label="Open Navigation Menu">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 class="header-title-text">Dashboard</h1>
    </header>

    <!-- Page Content -->
    <main class="page-content page-enter">
      <!-- Welcome Hero matching User Screenshot -->
      <div class="dash-welcome-hero">
        <img src="assets/icons/mei-logo.png" alt="MEI Logo" class="dash-hero-logo">
        <div class="dash-hero-text">
          <div class="dash-hero-greeting">Welcome</div>
          <div class="dash-hero-name" id="welcome-name">KAVIRAJ S</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script src="js/firebase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(console.error);
    }

    initFirebase();

    // Auth check
    function checkAuthAndLoad() {
      const session = typeof checkSession === 'function' ? checkSession() : { valid: false };
      if (session.valid && session.user) {
        loadDashboard(session.user);
        return;
      }

      if (typeof firebase !== 'undefined' && auth) {
        auth.onAuthStateChanged(async (user) => {
          if (user) {
            let userData = null;
            if (typeof DB !== 'undefined' && DB.user) {
              const snap = await DB.user(user.uid).once('value');
              userData = snap.val();
            }
            if (!userData && typeof getUserByUID === 'function') {
              userData = getUserByUID(user.uid);
            }
            loadDashboard(userData || { name: user.displayName || 'STUDENT', role: 'student' });
          } else {
            window.location.href = 'login.html';
          }
        });
      } else {
        window.location.href = 'login.html';
      }
    }

    function loadDashboard(userData) {
      if (!userData) {
        window.location.href = 'login.html';
        return;
      }

      if (userData.role === 'owner') {
        window.location.href = 'owner-panel.html';
        return;
      }

      if (userData.role === 'admin' || userData.role === 'staff') {
        window.location.href = 'admin-panel.html';
        return;
      }

      // Update UI with student's dynamic name
      if (userData.name) {
        const nameEl = document.getElementById('welcome-name');
        if (nameEl) nameEl.textContent = userData.name;
      }

      PageLoader.hide();
      showLocationModal();
    }

    // Location Permission Modal Logic
    function showLocationModal() {
      const modal = document.getElementById('location-permission-modal');
      if (modal) modal.classList.remove('hidden');
    }

    function dismissLocationModal(allowed) {
      const modal = document.getElementById('location-permission-modal');
      if (modal) modal.classList.add('hidden');
      if (allowed && navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          () => {},
          () => {},
          { timeout: 5000 }
        );
      }
    }

    // Dismiss location modal when clicking anywhere on screen outside the modal card
    document.getElementById('location-permission-modal')?.addEventListener('click', (e) => {
      const card = e.target.closest('.loc-modal-card');
      if (!card) {
        dismissLocationModal(false);
      }
    });

    // Ensure location modal opens whenever navigating to dashboard
    window.addEventListener('pageshow', () => {
      showLocationModal();
    });

    // Logout
    document.getElementById('drawer-logout-btn')?.addEventListener('click', () => {
      if (typeof clearSessionAndRedirect === 'function') {
        clearSessionAndRedirect();
      } else {
        sessionStorage.clear();
        localStorage.removeItem('mei_auth_token');
        window.location.href = 'login.html';
      }
    });

    checkAuthAndLoad();
  </script>
</body>
</html>
