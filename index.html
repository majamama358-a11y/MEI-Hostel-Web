<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2878C8">
  <title>Mahendra Hostel</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: linear-gradient(145deg, #2878C8 0%, #3545A8 50%, #42158F 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .splash-container {
      text-align: center;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.5s ease-out;
    }
    .splash-logo {
      width: 88px;
      height: 88px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.2);
    }
    .splash-logo svg {
      width: 48px;
      height: 48px;
      stroke: #fff;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .splash-title {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.8rem;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .splash-subtitle {
      font-size: 0.95rem;
      opacity: 0.85;
      margin-bottom: 30px;
      font-weight: 500;
    }
    .splash-spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="splash-logo">
      <img src="assets/icons/mei-logo.png" alt="MEI Logo" style="width:58px;height:auto">
    </div>
    <div class="splash-title">MAHENDRA HOSTEL</div>
    <div class="splash-subtitle">Mahendra Engineering College</div>
    <div class="splash-spinner"></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(console.error);
    }

    // Determine destination route based on stored session or Firebase
    function routeUser() {
      initFirebase();
      if (typeof seedMasterOwner === 'function') {
        seedMasterOwner();
      }

      const session = typeof checkSession === 'function' ? checkSession() : { valid: false };
      if (session.valid && session.user) {
        const target = typeof getRoleRedirectURL === 'function' 
          ? getRoleRedirectURL(session.user.role)
          : (session.user.role === 'owner' ? 'owner-panel.html' : (session.user.role === 'admin' ? 'admin-panel.html' : 'dashboard.html'));
        window.location.replace(target);
        return;
      }

      // Default to login page
      setTimeout(() => {
        window.location.replace('login.html');
      }, 350);
    }

    document.addEventListener('DOMContentLoaded', routeUser);
  </script>
</body>
</html>
